name: CI
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features kernel,user -- --D warnings
      - run: RUSTDOCFLAGS=-Dwarnings cargo doc --workspace --no-deps --features kernel,user
      - run: cargo test --workspace --features kernel,user
      - run: cargo test --workspace --features kernel
      - run: cargo test --workspace --features user
  no-std:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target: [x86_64-unknown-none, aarch64-unknown-none, riscv64gc-unknown-none-elf]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build -p sysabi --target ${{ matrix.target }} --features kernel,user

  msrv:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo check --workspace --features kernel,user